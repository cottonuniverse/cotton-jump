<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotton Jump 🍄</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a2e; color:#fff; font-family:'Segoe UI',Arial,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:16px; min-height:100vh; }
  h1 { color:#ffd700; margin-bottom:10px; font-size:26px; text-align:center; }
  #hud { display:flex; gap:18px; font-size:16px; margin-bottom:8px; flex-wrap:wrap; justify-content:center; }
  #wrap { position:relative; max-width:100%; }
  canvas { background:#5c94fc; border:4px solid #000; border-radius:8px; max-width:100%; height:auto; display:block; }
  #overlay { position:absolute; inset:0; background:rgba(0,0,0,.86);
             display:flex; flex-direction:column; align-items:center; justify-content:center;
             text-align:center; padding:20px; border-radius:8px; }
  #overlay.hidden { display:none; }
  .hidden { display:none !important; }
  input, button { padding:11px 16px; font-size:16px; border-radius:8px; border:none; margin:5px; }
  input { width:220px; text-align:center; }
  button { background:#ffd700; cursor:pointer; font-weight:bold; color:#1a1a2e; }
  button:hover { background:#ffea00; }
  h2 { margin-bottom:6px; }
  table { margin-top:12px; border-collapse:collapse; font-size:14px; min-width:260px; }
  td, th { padding:6px 10px; border-bottom:1px solid #444; text-align:left; }
  .me { background:#ffd70022; }
  .controls { color:#aaa; font-size:13px; margin-top:10px; text-align:center; }
  .touch { display:flex; gap:10px; margin-top:12px; }
  .touch button { width:70px; height:70px; font-size:26px; border-radius:50%; }
  @media(min-width:820px){ .touch{ display:none; } }
</style>
</head>
<body>
<h1>🍄 Cotton Jump</h1>
<div id="hud">
  <span>⭐ <b id="skor">0</b></span>
  <span>🪙 <b id="syiling">0</b></span>
  <span>❤️ <b id="nyawa">3</b></span>
  <span>🗺️ Level <b id="lvl">1</b>/3</span>
  <span>⏱️ <b id="masa">00:00</b></span>
</div>

<div id="wrap">
  <canvas id="game" width="800" height="400"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">🎮 Masukkan Nama</h2>
    <p id="ovMsg">Nama anda akan masuk papan pemenang!</p>
    <input id="namaInput" placeholder="Nama anda..." maxlength="15">
    <div>
      <button id="btnMula">MULA ▶</button>
      <button id="btnLagi" class="hidden">Main Lagi 🔁</button>
    </div>
    <div id="lbBox">
      <table id="lb"></table>
    </div>
  </div>
</div>

<div class="touch">
  <button id="tKiri">◀</button>
  <button id="tLompat">⤒</button>
  <button id="tKanan">▶</button>
</div>

<p class="controls">⌨️ ← → gerak &nbsp;|&nbsp; SPACE / ↑ lompat &nbsp;|&nbsp; hentak atas musuh = +200</p>

<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const GRAVITI = 0.7, LOMPAT = -13, LAJU = 4.5;
let player, enemies, coins, blocks, skor, syilingKutip, nyawa, lvlIdx;
let running = false, keys = {}, frame = 0, masaMula = 0, timerId = null;

const heroImg = new Image();
let heroReady = false;
let heroSprite = null;      // versi kecil siap-skala (elak kecilkan gambar besar setiap frame)
const HERO_H = 80;
heroImg.onload = ()=>{
  const w = Math.round(HERO_H * (heroImg.width/heroImg.height));
  const off = document.createElement('canvas');
  off.width = w; off.height = HERO_H;
  off.getContext('2d').drawImage(heroImg, 0, 0, w, HERO_H);
  heroSprite = off;
  heroReady = true;
};
heroImg.src = 'cotton-rider.png';

let particles = [], popups = [];
// palet setiap level: langit atas, langit bawah, bukit jauh, bukit dekat, tanah, rumput
const PALETTE = [
  { skyT:'#7ec0ff', skyB:'#cdeafe', hill1:'#7fc77f', hill2:'#5aa85a', tanah:'#c8792e', rumput:'#3fbf3f' },
  { skyT:'#ff9a56', skyB:'#ffd39b', hill1:'#c96a4a', hill2:'#9c4f38', tanah:'#7a3b1e', rumput:'#d98b3a' },
  { skyT:'#2d1b69', skyB:'#5b3a9c', hill1:'#3a2a6e', hill2:'#241a4a', tanah:'#1f1740', rumput:'#6a4fb0' }
];
function spawnPercik(x,y,warna,n=8){
  for(let i=0;i<n;i++) particles.push({
    x, y, vx:(Math.random()-0.5)*4, vy:-Math.random()*4-1,
    life:1, warna
  });
}
function spawnPopup(x,y,teks){ popups.push({ x, y, teks, life:1 }); }

const LEVELS = [
  { groundY:350, bg:'#5c94fc',
    coins:[[300,250],[340,250],[380,250],[550,180]],
    enemies:[{x:500},{x:700}],
    blocks:[{x:320,y:200},{x:360,y:200}], flagX:760 },
  { groundY:350, bg:'#ff9a56',
    coins:[[200,200],[240,200],[420,150],[460,150],[600,220]],
    enemies:[{x:350},{x:550},{x:650}],
    blocks:[{x:210,y:230},{x:430,y:180},{x:450,y:180}], flagX:770 },
  { groundY:350, bg:'#2d1b69',
    coins:[[180,180],[300,140],[340,140],[500,190],[540,190],[620,130]],
    enemies:[{x:280},{x:400},{x:520},{x:600},{x:700}],
    blocks:[{x:190,y:210},{x:310,y:170},{x:330,y:170},{x:510,y:220}], flagX:780 }
];

// ---- sound (dijana, tiada fail audio) ----
let actx;
function bunyi(freq, dur=0.1, type='square', vol=0.15){
  try{
    if(!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
const sLompat  = () => bunyi(500,.12);
const sSyiling = () => { bunyi(988,.08); setTimeout(()=>bunyi(1319,.15),80); };
const sHentak  = () => bunyi(200,.18,'sawtooth');
const sMati    = () => [400,300,200,100].forEach((f,i)=>setTimeout(()=>bunyi(f,.2),i*110));
const sMenang  = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>bunyi(f,.25,'triangle'),i*150));
const sFlag    = () => { bunyi(660,.1); setTimeout(()=>bunyi(880,.2),100); };

let bgCanvas = null;
function buildBg(L){
  const P = PALETTE[lvlIdx] || PALETTE[0];
  const off = document.createElement('canvas');
  off.width = cv.width; off.height = cv.height;
  const c = off.getContext('2d');
  const g = c.createLinearGradient(0,0,0,L.groundY);
  g.addColorStop(0, P.skyT); g.addColorStop(1, P.skyB);
  c.fillStyle = g; c.fillRect(0,0,cv.width,L.groundY);
  c.fillStyle = 'rgba(255,255,255,.35)';
  c.beginPath(); c.arc(700,80,40,0,7); c.fill();
  const bukitOff = (baseY,amp,warna,ofs)=>{
    c.fillStyle = warna; c.beginPath(); c.moveTo(0,cv.height);
    for(let x=0;x<=cv.width;x+=20){ c.lineTo(x, baseY + Math.sin((x+ofs)/120)*amp); }
    c.lineTo(cv.width,cv.height); c.closePath(); c.fill();
  };
  bukitOff(L.groundY-40,18,P.hill1,0);
  bukitOff(L.groundY-10,12,P.hill2,200);
  const pokokOff = (x)=>{
    c.fillStyle='#7a4a1e'; c.fillRect(x-4,L.groundY-30,8,30);
    c.fillStyle=P.hill1;
    c.beginPath(); c.arc(x,L.groundY-38,16,0,7); c.fill();
    c.beginPath(); c.arc(x-12,L.groundY-30,12,0,7); c.fill();
    c.beginPath(); c.arc(x+12,L.groundY-30,12,0,7); c.fill();
  };
  pokokOff(90); pokokOff(cv.width-120);
  c.fillStyle=P.tanah; c.fillRect(0,L.groundY,cv.width,cv.height-L.groundY);
  c.fillStyle=P.rumput; c.fillRect(0,L.groundY,cv.width,10);
  for(let x=0;x<cv.width;x+=14){ c.fillRect(x,L.groundY-3,2,4); }
  bgCanvas = off;
}
function loadLevel(i){
  const L = LEVELS[i];
  cv.style.background = L.bg;
  player = {x:40, y:300, w:32, h:38, vx:0, vy:0, diTanah:false};
  enemies = L.enemies.map(e=>({x:e.x, y:L.groundY-30, w:34, h:30, vx:-1.2}));
  coins = L.coins.map(c=>({x:c[0], y:c[1], w:22, h:22, ambil:false}));
  blocks = L.blocks.map(b=>({...b}));
  buildBg(L);
}
function updateHUD(){
  document.getElementById('skor').textContent = skor;
  document.getElementById('syiling').textContent = syilingKutip;
  document.getElementById('nyawa').textContent = nyawa;
  document.getElementById('lvl').textContent = lvlIdx+1;
}
function mulaTimer(){
  clearInterval(timerId);
  masaMula = Date.now();
  timerId = setInterval(()=>{
    const s = Math.floor((Date.now()-masaMula)/1000);
    document.getElementById('masa').textContent =
      String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }, 250);
}
function reset(){
  skor=0; syilingKutip=0; nyawa=3; lvlIdx=0;
  document.getElementById('btnLagi').classList.add('hidden');
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('lbBox').style.display='none';
  loadLevel(0); updateHUD(); mulaTimer();
  if(!running){ running=true; loop(); }
}
function mulaMain(){
  const n = document.getElementById('namaInput').value.trim();
  if(!n){ alert('Masukkan nama dulu 😊'); return; }
  localStorage.setItem('cotton_nama', n);
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  reset();
}
function mati(){
  nyawa--; sMati(); updateHUD();
  if(nyawa<=0) tamat(false);
  else { player.x=40; player.y=300; player.vx=player.vy=0; }
}
function nextLevel(){
  if(lvlIdx >= LEVELS.length-1){ tamat(true); return; }
  lvlIdx++; loadLevel(lvlIdx); updateHUD();
}
function tamat(menang){
  running=false; clearInterval(timerId);
  const masa = Math.floor((Date.now()-masaMula)/1000);
  const bonus = menang ? Math.max(0,(600-masa))*5 : 0;
  const skorAkhir = skor + bonus;
  simpanSkor(skorAkhir);
  if(menang) sMenang();
  document.getElementById('ovTitle').textContent = menang ? '🏆 Tahniah! Habis semua level!' : '💀 Game Over';
  document.getElementById('ovMsg').innerHTML =
    'Skor asas: <b>'+skor+'</b>' +
    (menang ? ' &nbsp;|&nbsp; ⏱️ '+masa+'s &nbsp;|&nbsp; 🎁 Bonus laju: <b>+'+bonus+'</b>' : '') +
    '<br>⭐ Skor akhir: <b style="color:#ffd700;font-size:22px">'+skorAkhir+'</b>';
  document.getElementById('btnLagi').classList.remove('hidden');
  document.getElementById('lbBox').style.display='block';
  document.getElementById('overlay').classList.remove('hidden');
  renderLB();
}
function simpanSkor(s){
  let lb = JSON.parse(localStorage.getItem('cotton_lb')||'[]');
  lb.push({ nama: localStorage.getItem('cotton_nama'), skor: s });
  lb.sort((a,b)=>b.skor-a.skor);
  lb = lb.slice(0,10);
  localStorage.setItem('cotton_lb', JSON.stringify(lb));
}
function renderLB(){
  const lb = JSON.parse(localStorage.getItem('cotton_lb')||'[]');
  const me = localStorage.getItem('cotton_nama');
  const medal = ['🥇','🥈','🥉'];
  document.getElementById('lb').innerHTML =
    '<tr><th>#</th><th>Nama</th><th>Skor</th></tr>' +
    (lb.length ? lb.map((e,i)=>
      '<tr class="'+(e.nama===me?'me':'')+'"><td>'+(medal[i]||(i+1))+
      '</td><td>'+e.nama+'</td><td>'+e.skor+'</td></tr>').join('')
    : '<tr><td colspan="3">Belum ada pemenang — jadi yang pertama! 🚀</td></tr>');
}

// ---- input ----
addEventListener('keydown', e=>{ keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e=>{ keys[e.code]=false; });
function bindTouch(id, code){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); keys[code]=true; };
  const off = e=>{ e.preventDefault(); keys[code]=false; };
  el.addEventListener('touchstart',on); el.addEventListener('touchend',off);
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
}
bindTouch('tKiri','ArrowLeft'); bindTouch('tKanan','ArrowRight'); bindTouch('tLompat','Space');
document.getElementById('btnMula').onclick = mulaMain;
document.getElementById('btnLagi').onclick = reset;
document.getElementById('namaInput').addEventListener('keydown', e=>{ if(e.key==='Enter') mulaMain(); });

// ---- loop ----
function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function loop(){
  requestAnimationFrame(loop);
  frame++;
  const L = LEVELS[lvlIdx];
  player.vx = (keys.ArrowRight?LAJU:0) - (keys.ArrowLeft?LAJU:0);
  if((keys.Space||keys.ArrowUp) && player.diTanah){ player.vy=LOMPAT; sLompat(); }
  player.vy += GRAVITI;
  player.x = Math.max(0, Math.min(cv.width-player.w, player.x+player.vx));
  player.y += player.vy; player.diTanah=false;
  if(player.y+player.h >= L.groundY){ player.y=L.groundY-player.h; player.vy=0; player.diTanah=true; }
  blocks.forEach(b=>{
    if(player.x<b.x+40 && player.x+player.w>b.x && player.y<b.y+20 && player.y+player.h>b.y && player.vy>0){
      player.y=b.y-player.h; player.vy=0; player.diTanah=true;
    }
  });
  coins.forEach(c=>{
    if(!c.ambil && hit(player,c)){
      c.ambil=true; skor+=100; syilingKutip++; sSyiling(); updateHUD();
      spawnPercik(c.x+11,c.y+11,'#ffd700'); spawnPopup(c.x+11,c.y,'+100');
    }
  });
  enemies.forEach(en=>{
    en.x += en.vx;
    if(en.x<0 || en.x+en.w>cv.width) en.vx*=-1;
    if(hit(player,en)){
      if(player.vy>0 && player.y+player.h-en.y<25){
        enemies.splice(enemies.indexOf(en),1); player.vy=-9; skor+=200; sHentak(); updateHUD();
        spawnPercik(en.x+en.w/2,en.y,'#a86',10); spawnPopup(en.x+en.w/2,en.y-6,'+200');
      } else mati();
    }
  });
  if(hit(player,{x:L.flagX,y:L.groundY-100,w:30,h:100})){ sFlag(); nextLevel(); }
  // kemas kini kesan
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life-=0.03; });
  particles = particles.filter(p=>p.life>0);
  popups.forEach(p=>{ p.y-=0.8; p.life-=0.02; });
  popups = popups.filter(p=>p.life>0);
  lukis(L);
}
function bukit(baseY, amp, warna, ofsetX){
  ctx.fillStyle = warna;
  ctx.beginPath();
  ctx.moveTo(0, cv.height);
  for(let x=0; x<=cv.width; x+=20){
    const y = baseY + Math.sin((x+ofsetX)/120) * amp;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(cv.width, cv.height);
  ctx.closePath(); ctx.fill();
}
function pokok(x, groundY, warna){
  ctx.fillStyle = '#7a4a1e';
  ctx.fillRect(x-4, groundY-30, 8, 30);
  ctx.fillStyle = warna;
  ctx.beginPath(); ctx.arc(x, groundY-38, 16, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x-12, groundY-30, 12, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+12, groundY-30, 12, 0, 7); ctx.fill();
}
function lukis(L){
  // latar siap-lukis (satu gambar) — jimat banyak kerja
  if(bgCanvas) ctx.drawImage(bgCanvas,0,0); else ctx.clearRect(0,0,cv.width,cv.height);
  // awan bergerak (satu-satunya bahagian latar yang dilukis semula)
  ctx.fillStyle='rgba(255,255,255,.9)';
  [120,420,680].forEach((x,i)=>{
    const cx=(x+frame/50)%900-100, cy=60+i*8;
    ctx.beginPath(); ctx.arc(cx,cy,18,0,7); ctx.arc(cx+20,cy+4,22,0,7); ctx.arc(cx+42,cy,16,0,7); ctx.fill();
  });
  // blok ?
  blocks.forEach(b=>{
    ctx.fillStyle='#e0a848'; ctx.fillRect(b.x,b.y,40,20);
    ctx.fillStyle='#b07820'; ctx.fillRect(b.x,b.y+16,40,4);
    ctx.fillStyle='#fff'; ctx.font='bold 15px Arial'; ctx.textAlign='center'; ctx.fillText('?',b.x+20,b.y+15); ctx.textAlign='left';
  });
  // syiling berkilau
  coins.forEach(c=>{
    if(c.ambil) return;
    const lw = Math.abs(Math.sin(frame/15))*10+2;
    ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.ellipse(c.x+11,c.y+11,lw,11,0,0,7); ctx.fill();
    ctx.fillStyle='#fff8c0'; ctx.beginPath(); ctx.ellipse(c.x+11,c.y+8,lw*0.4,4,0,0,7); ctx.fill();
  });
  // musuh (gerakan sedikit turun-naik)
  enemies.forEach(en=>{
    const b = Math.sin(frame/8 + en.x)*2;
    ctx.fillStyle='#8b4513'; ctx.fillRect(en.x,en.y+b,en.w,en.h);
    ctx.fillStyle='#5a2d0c'; ctx.fillRect(en.x,en.y+en.h-4+b,en.w,4);
    ctx.fillStyle='#fff'; ctx.fillRect(en.x+6,en.y+6+b,8,8); ctx.fillRect(en.x+20,en.y+6+b,8,8);
    ctx.fillStyle='#000'; ctx.fillRect(en.x+8,en.y+8+b,4,4); ctx.fillRect(en.x+22,en.y+8+b,4,4);
  });
  // bendera
  ctx.fillStyle='#eee'; ctx.fillRect(L.flagX,L.groundY-100,5,100);
  ctx.fillStyle='#ff4d8d'; ctx.beginPath();
  ctx.moveTo(L.flagX+5,L.groundY-100); ctx.lineTo(L.flagX+35,L.groundY-85+Math.sin(frame/10)*2); ctx.lineTo(L.flagX+5,L.groundY-70); ctx.fill();
  // percikan
  particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.warna; ctx.fillRect(p.x,p.y,4,4); });
  ctx.globalAlpha=1;
  if(heroReady && heroSprite){
    // lukis Cotton Rider (sprite siap-skala) dengan animasi ringan
    const bob = player.diTanah ? Math.abs(Math.sin(frame/6))*2 : 0;
    const dw = heroSprite.width, dh = heroSprite.height - bob;
    const dx = player.x + player.w/2 - dw/2;
    const dy = (player.y + player.h) - dh;
    const kiri = player.vx < 0;
    // bayang
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath();
    ctx.ellipse(player.x+player.w/2, L.groundY-2, 20, 5, 0, 0, 7); ctx.fill();
    ctx.save();
    if(kiri){ ctx.translate(dx+dw,dy); ctx.scale(-1,1); ctx.drawImage(heroSprite,0,0,dw,dh); }
    else { ctx.drawImage(heroSprite,dx,dy,dw,dh); }
    ctx.restore();
  } else {
    ctx.fillStyle='#ff69b4'; ctx.fillRect(player.x,player.y,32,20);
    ctx.fillStyle='#fdbcb4'; ctx.fillRect(player.x+6,player.y-14,20,16);
    ctx.fillStyle='#c2185b'; ctx.fillRect(player.x,player.y+20,32,18);
  }
  // nombor mata timbul
  popups.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle='#fff'; ctx.font='bold 16px Arial'; ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=3; ctx.strokeText(p.teks,p.x,p.y);
    ctx.fillText(p.teks,p.x,p.y); ctx.textAlign='left';
  });
  ctx.globalAlpha=1;
}

if(localStorage.getItem('cotton_nama'))
  document.getElementById('namaInput').value = localStorage.getItem('cotton_nama');
renderLB();
</script>
</body>
</html>
